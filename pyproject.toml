[project]
name = "ai-playlist-mixer"
version = "1.1.0"
description = "Real-time multi-device music coordination with fairness-aware reranking"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
