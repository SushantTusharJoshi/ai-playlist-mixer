# Party summary eval gate, run through the shared llm-eval-kit composite action.
#
#   mock: every pull request and push. Checks the committed kit suites match the prompt code,
#         then runs the prompt-hardening suite against the kit's echo provider and the baseline.
#   groq: push to main and manual runs only, never on pull requests, so forks cannot reach the
#         key. Skips itself when the GROQ_API_KEY secret is not set.
#
# Suites are generated by backend/evals/render_kit_suites.py (its docstring explains both).
name: Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  party-summary-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pyyaml

      - name: Kit suites match the prompt code
        working-directory: backend
        run: python -m evals.render_kit_suites --check

      # First-party action, tracked at main on purpose so the gate picks up kit fixes.
      - name: Party summary suite (mock provider)
        uses: SushantTusharJoshi/llm-eval-kit@main
        with:
          suite: backend/evals/kit/party_summary.mock.json
          baseline: backend/evals/kit/baseline.mock.json
          provider: mock
          report-path: reports/party-summary-mock.json

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: party-summary-mock-report
          path: reports/party-summary-mock.json
          if-no-files-found: ignore

  party-summary-groq:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: party-summary-groq
      cancel-in-progress: false
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Skip without a key
        if: ${{ env.GROQ_API_KEY == '' }}
        run: echo "::notice::GROQ_API_KEY is not set; skipping the live party summary eval."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.GROQ_API_KEY != '' }}
        with:
          persist-credentials: false

      # 7 cases plus 7 judge calls; the caps stop a runaway run.
      - name: Party summary suite (Groq, judged)
        if: ${{ env.GROQ_API_KEY != '' }}
        uses: SushantTusharJoshi/llm-eval-kit@main
        with:
          suite: backend/evals/kit/party_summary.groq.json
          provider: groq
          model: openai/gpt-oss-120b
          max-cost: "0.05"
          extra-args: "--no-cache --max-calls 20"
          report-path: reports/party-summary-groq.json

      - name: Upload report
        if: ${{ always() && env.GROQ_API_KEY != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: party-summary-groq-report
          path: reports/party-summary-groq.json
          if-no-files-found: ignore
